<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="polaris-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="50" cy="50" r="15" fill="url(#polaris-grad)" opacity="0.2" filter="url(#logo-glow)"/>
  <!-- Compass/Star path -->
  <path d="M50 12 L54.5 40.5 Q55 45 59.5 45.5 L88 50 L59.5 54.5 Q55 55 54.5 59.5 L50 88 L45.5 59.5 Q45 55 40.5 54.5 L12 50 L40.5 45.5 Q45 45 45.5 40.5 Z" fill="url(#polaris-grad)" />
  <!-- Center hub -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  <!-- Orbit Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#polaris-grad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3" />
</svg>
